user root;

worker_processes auto;

error_log /config/logs/nginx/error.log warn;
pid /config/logs/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /config/logs/nginx/access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # --------------------------------------------------
    # Node.js application
    # --------------------------------------------------

    upstream node_app {
        server 127.0.0.1:3000;
    }

    # --------------------------------------------------
    # code-server
    # --------------------------------------------------

    upstream code_server {
        server 127.0.0.1:8443;
    }

    server {
        listen 8000;
        server_name _;
        absolute_redirect off;

        # --------------------------------------------------
        # Health check
        # --------------------------------------------------

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Internal authentication subrequest. External clients cannot call it.
        location = /_totp_auth {
            internal;
            proxy_pass http://node_app/api/nginx/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------------
        # code-server
        #
        # External:
        #   /vscode/
        #
        # Internal:
        #   127.0.0.1:8443
        # --------------------------------------------------

        location = /vscode {
            auth_request /_totp_auth;
            try_files /__totp_authenticated_redirect__ @vscode_redirect;
        }

        location @vscode_redirect {
            return 301 /vscode/;
        }

        location /vscode/ {
            auth_request /_totp_auth;
            proxy_pass http://code_server/;

            proxy_http_version 1.1;
            proxy_buffering off;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /vscode;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # --------------------------------------------------
        # Node.js application
        #
        # External:
        #   /app/
        #
        # Internal:
        #   127.0.0.1:3000
        # --------------------------------------------------

        location = /app/auth {
            auth_request /_totp_auth;
            try_files /__totp_authenticated_redirect__ @app_auth_redirect;
        }

        location @app_auth_redirect {
            return 301 /app/auth/;
        }

        location /app/auth/ {
            auth_request /_totp_auth;
            proxy_pass http://node_app/auth/;

            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /app/ {
            proxy_pass http://node_app/;

            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # --------------------------------------------------
        # Default web
        # --------------------------------------------------

        location / {
            root /config/www;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
