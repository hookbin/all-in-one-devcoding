user abc;

worker_processes auto;

error_log /config/logs/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /config/logs/nginx/access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # --------------------------------------------------
    # Node.js application
    # --------------------------------------------------

    upstream node_app {
        server 127.0.0.1:3000;
    }

    # --------------------------------------------------
    # code-server
    # --------------------------------------------------

    upstream code_server {
        server 127.0.0.1:8443;
    }

    # --------------------------------------------------
    # mongo-express
    # --------------------------------------------------

    upstream mongo_express {
        server 127.0.0.1:8081;
    }

    server {
        listen 8000;
        server_name _;

        # --------------------------------------------------
        # Health check
        # --------------------------------------------------

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # --------------------------------------------------
        # code-server
        #
        # External:
        #   /vscode/
        #
        # Internal:
        #   127.0.0.1:8443
        # --------------------------------------------------

        location = /vscode {
            return 301 /vscode/;
        }

        location /vscode/ {
            proxy_pass http://code_server/;

            proxy_http_version 1.1;
            proxy_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /vscode;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # --------------------------------------------------
        # mongo-express
        #
        # External:
        #   /express/
        #
        # Internal:
        #   127.0.0.1:8081
        # --------------------------------------------------

        location /express/ {
            proxy_pass http://mongo_express/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------------
        # Node.js application
        #
        # External:
        #   /app/
        #
        # Internal:
        #   127.0.0.1:3000
        # --------------------------------------------------

        location /app/ {
            proxy_pass http://node_app/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # code-server requests its manifest from the host root.
        location = /manifest.json {
            proxy_pass http://code_server/manifest.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------------
        # Default web
        # --------------------------------------------------

        location / {
            root /config/www;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}