events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /config/logs/nginx/access.log;
    error_log  /config/logs/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8000;
        server_name _;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Public static site.
        location / {
            root /config/www;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Development application. No TOTP.
        # /app/foo -> http://127.0.0.1:3000/foo
        location /app/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        # code-server. TOTP protected.
        location /vscode/ {
            auth_request /_totp_verify;
            error_page 401 = @totp_login;

            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        # mongo-express. TOTP protected.
        location /express/ {
            auth_request /_totp_verify;
            error_page 401 = @totp_login;

            proxy_pass http://127.0.0.1:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # TOTP login/verification endpoints.
        location /totp/ {
            proxy_pass http://127.0.0.1:4180/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Internal auth_request endpoint.
        location = /_totp_verify {
            internal;
            proxy_pass http://127.0.0.1:4180/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Cookie $http_cookie;
        }

        # auth_request 401 -> TOTP login page.
        location @totp_login {
            proxy_pass http://127.0.0.1:4180/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
