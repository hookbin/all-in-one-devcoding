name: Build and Publish Docker Image

# 定义触发条件：推送到 main、手动执行或每周一运行
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:

# 定义工作流的步骤
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        run: docker build -t all-in-one-devcoding:test .

      - name: Run container smoke tests
        run: bash tests/container-smoke.sh

      - name: Push Docker image
        run: |
          docker tag all-in-one-devcoding:test hookbin/all-in-one-devcoding:latest
          docker push hookbin/all-in-one-devcoding:latest
